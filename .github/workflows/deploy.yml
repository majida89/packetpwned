# .github/workflows/thm-stats.yml
#
# Runs every Monday at 06:00 UTC.
# Fetches TryHackMe stats → writes data/thm.json → rebuilds Hugo → deploys.
#
# Also runs on every normal push to main so regular deploys still work.

name: Update THM Stats & Deploy

on:
  schedule:
    - cron: "0 6 * * 1"       # Every Monday 06:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:           # Allow manual trigger from GitHub UI

permissions:
  contents: write              # Needed to commit thm.json back to repo
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # Full history (Hugo needs it for .GitInfo)

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests beautifulsoup4

      # ── 3. Fetch THM stats ─────────────────────────────────────────────────
      - name: Fetch TryHackMe stats
        run: python3 scripts/fetch_thm_stats.py

      # ── 4. Commit updated thm.json if it changed ───────────────────────────
      - name: Commit thm.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/thm.json
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: update THM stats [skip ci]"
          git push

      # ── 5. Set up Hugo ─────────────────────────────────────────────────────
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true       # Required if you use SCSS

      # ── 6. Build Hugo site ─────────────────────────────────────────────────
      - name: Build Hugo site
        run: hugo --minify

      # ── 7. Deploy to GitHub Pages ──────────────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
